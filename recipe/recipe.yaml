schema_version: 1

context:
  version: "2.0"

package:
  name: pkginfo
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/p/pkginfo/pkginfo-${{ version }}.tar.gz
  sha256: f7b4f267881785582c923631a0fa7e275b0d390a5cbab54aa4ec0ecc7eddb375

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv
  python:
    entry_points:
      - pkginfo = pkginfo.commandline:main

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools
    - pip
  run:
    - python >=${{ python_min }}

tests:
  - python:
      imports:
        - pkginfo
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
    script:
      - rio --help

about:
  summary: Query metadata from sdists / bdists / installed packages
  license: MIT
  license_file: LICENSE.txt
  homepage: https://pypi.org/project/pkginfo/
  documentation: https://tseaver.github.io/pkginfo

extra:
  recipe-maintainers:
    - jakirkham
    - jankatins
    - mingwandroid
